name: release binaries

# What a customer downloads. PyInstaller cannot cross-compile, so each
# platform's binary is built on that platform and attached to the release.
#
# Driven by tools/release.sh, which dispatches this against a DRAFT release and
# waits for the four binaries to appear.
#
# Deliberately NOT triggered by `release: published` any more. That trigger
# would fire again the moment release.sh undrafts, rebuild all four binaries,
# and --clobber them -- and PyInstaller output is not reproducible, so the new
# bytes would no longer match the sha256 in the manifest that was just signed
# over them. Every daemon would then refuse its own release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to attach binaries to
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, label: macos-arm64}
          # macos-15-intel, not macos-13. The macos-13 label no longer gets a
          # runner assigned on this account -- it sat queued with an empty
          # runner_name for the whole rehearsal, and the installer workflow hit
          # the same thing months ago and worked around it by dropping the job
          # rather than fixing the label. Intel Macs are still a supported
          # target; the runner that builds for them just moved.
          - {os: macos-15-intel, label: macos-x86_64}
          - {os: ubuntu-latest, label: linux-x86_64}
          - {os: windows-latest, label: windows-x86_64}
    defaults:
      run:
        shell: bash
    steps:
      # The TAG, not the default branch. release.sh builds the firmware from
      # its own working tree at this tag and then dispatches this workflow; a
      # bare checkout takes the default branch's HEAD instead, so the two
      # halves of one release could be built from different source. The
      # --version check below catches that only when the version happens to
      # differ.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sh tools/build_binary.sh

      # The tag is the product's version, and the binary has to know it: the
      # self-test in pc/update.py refuses to install a replacement that does
      # not report the version it was fetched as, so a binary built from a
      # source tree whose pc/version.py disagrees with the tag would fail on
      # a customer's machine rather than here.
      - name: it must report the version this tag is for
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # Not `ls a b | head -1`: ls exits non-zero when one operand is
          # missing, and this workflow runs with -e -o pipefail, so the job
          # died here before doing anything. It passed on Windows only because
          # MSYS resolves `dist/overwatch` to `dist/overwatch.exe`, which is why the
          # one platform that cannot run the binary was the one that agreed.
          built=dist/overwatch/overwatch
          [ -f "$built" ] || built=dist/overwatch/overwatch.exe
          # The version inside the tag, whatever the tag is called around
          # it. Upstream tags `v1.3.3`; this fork tags `overwatch-v1.3.3`,
          # and `${TAG#v}` strips nothing from that -- it only removes a
          # LEADING v. The gate then compared a binary reporting "1.3.3"
          # against the literal string "overwatch-v0.1.0" and failed all
          # four jobs before a single byte was uploaded.
          #
          # So: drop everything up to and including the last '-', then a
          # leading 'v'. v1.3.3, overwatch-v1.3.3 and overwatch-1.3.3 all
          # come out as 1.3.3.
          want=${TAG##*-}
          want=${want#v}
          got=$("$built" --version)
          echo "tag $TAG -> expecting $want; binary says $got"
          case "$got" in
            *"$want"*) ;;
            *) echo "FATAL: built $got, but this release is $want" >&2
               echo "The tag and pc/version.py have to agree. Either tag" >&2
               echo "the release for the version in version.py, or bump" >&2
               echo "version.py to the version in the tag." >&2
               exit 1 ;;
          esac

      # ------------------------------------------------------ macOS signing
      #
      # Every step here tolerates absent secrets and says so, rather than being
      # gated behind an `if` on them. Two reasons: a step-level `env` is not in
      # scope for that step's own `if` (the lint job in installer.yml records
      # the same trap), and a script that no-ops on a runner with no
      # credentials is a script that gets EXERCISED on every release instead of
      # only the first one after somebody adds a certificate.
      #
      # Until MACOS_CERT_P12_BASE64 exists, this whole block prints why the
      # build is unsigned and changes nothing. See docs/notarisation.md.
      - name: import the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          if [ -z "${CERT_B64:-}" ]; then
            echo "no MACOS_CERT_P12_BASE64: this build will stay unsigned"
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          security create-keychain -p "$KCPW" "$KC"
          # The runner's keychain relocks on a timer by default, and a lock
          # partway through 53 codesign calls fails every one after it.
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # -T codesign plus set-key-partition-list, or the first signature
          # blocks on a GUI prompt nobody is there to answer and the job hangs
          # until its timeout.
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PW" \
            -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KCPW" "$KC" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning "$KC"

      - name: sign it
        if: runner.os == 'macOS'
        env:
          OVERWATCH_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -eu
          KC="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$KC" ]; then
            OVERWATCH_SIGN_KEYCHAIN="$KC"
            export OVERWATCH_SIGN_KEYCHAIN
          fi
          sh tools/macos_sign.sh dist/overwatch

      # Prove the artifact installs before it is published. A binary missing a
      # bundled data file fails on a customer's machine at the one moment they
      # are deciding whether this product works -- and PyInstaller missing a
      # data file is exactly the failure that does not show up at build time.
      #
      # AFTER signing, not before: the hardened runtime can take a binary's
      # ability to start away entirely (see tools/macos_sign.sh), so what gets
      # install-tested has to be the bytes that ship rather than their unsigned
      # ancestor. Before notarising, so a broken install fails in seconds
      # instead of after a round trip to Apple.
      - name: verify it installs and uninstalls
        run: |
          OVERWATCH_SKIP_SERVICE=1 sh tests/ci/check_install.sh with-statusline
          OVERWATCH_SKIP_SERVICE=1 sh tests/ci/check_install.sh no-claude

      - name: notarise it
        if: runner.os == 'macOS'
        env:
          NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          OVERWATCH_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          OVERWATCH_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -eu
          if [ -n "${NOTARY_KEY_B64:-}" ]; then
            printf '%s' "$NOTARY_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            OVERWATCH_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
            export OVERWATCH_NOTARY_KEY
          fi
          # The key is removed whatever happens: notarytool has already read
          # it by then, and leaving an App Store Connect private key in
          # RUNNER_TEMP outlives the step that needed it.
          rc=0
          sh tools/macos_notarize.sh dist/overwatch || rc=$?
          rm -f "$RUNNER_TEMP/notary.p8"
          exit $rc

      # Unconditional, so a failure anywhere above still takes the certificate
      # off the runner. GitHub's macOS runners are not shared between jobs, so
      # this is belt and braces rather than the only thing standing between a
      # Developer ID key and the next tenant -- but a signing key is exactly
      # the wrong thing to leave lying around on the strength of that.
      - name: remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          [ -f "$KC" ] || exit 0
          security delete-keychain "$KC" || true
          rm -f "$KC"

      # One archive per platform: tar.gz with the executable bit kept, zip on
      # Windows. The name and shape come from pc/update.py, which is also what
      # the daemon expects to unpack on the other end.
      - name: package it for the platform
        id: pack
        run: |
          out=$(python tools/package_binary.py "${{ matrix.label }}" dist/overwatch dist)
          echo "file=$out" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "${{ steps.pack.outputs.file }}" --clobber

      # The manifest that names these files' hashes is written and signed on
      # the maintainer's machine, not here -- the release key never leaves it.
      # See the publish block in tools/release.sh.
