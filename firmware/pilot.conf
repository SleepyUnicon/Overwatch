# Build for one of the two pilot (POC) boards rather than the production batch.
#
#   west build -b esp32_devkitc/esp32/procpu . -- -DEXTRA_CONF_FILE=pilot.conf
#
# Their display modules differ: see OVERWATCH_PANEL_PILOT in Kconfig. Flashing a
# stock (production) build to a pilot leaves it mirrored, red/blue swapped and
# dim -- and the reverse is equally wrong, so pick deliberately, per board.
CONFIG_OVERWATCH_PANEL_PILOT=y
