# Panel settings for the discrete KMRTM28028-SPI module on jumper wires,
# rather than the CYD's soldered-on panel.
#
#   west build ... -- ... -DEXTRA_CONF_FILE=wired.conf
#
# The firmware ships expecting the CYD's PRODUCTION panel, which renders
# mirrored and is wired RGB, so main.c re-issues MADCTL as MV|MY with the BGR
# bit cleared to compensate. This module needs none of that: measured on
# hardware 2026-09-23, it rendered MIRRORED with that correction applied, and
# rotating the board 180 degrees did not undo it - which is what rules out a
# rotation and leaves the mirror.
#
# BLINK_PANEL_PILOT compiles the correction away entirely, leaving the stock
# rotation=90 MADCTL the ili9xxx driver writes (BGR|MV). It also takes the
# backlight scale back to 100%, which is what this module wants anyway: it has
# no transistor driving it, just an ESP32 pin, so it has less light to give
# than the CYD's panel, not more.
#
# If the colours come out wrong after this - anything that should be red
# reading blue - the flag has gone one step too far: this panel would then be
# wired RGB like the production batch, and the fix is a custom MADCTL of MV
# alone with the BGR bit cleared, rather than either preset.
CONFIG_BLINK_PANEL_PILOT=y
