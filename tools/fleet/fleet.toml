# The desks a release is proved on, as they ARE -- not as upstream's were.
#
# This file listed three: local-mac holding board 20500d342b68, plus
# kfir@kfir-macbook and galit@lenovo-r90r7u44.lan. Those are upstream's lab.
# Two are other people's machines on another network and the third describes a
# different Mac with a different board, so the gate in pc/fleet_gate.py could
# never pass honestly here and every release since the fork has gone out with
# OVERWATCH_SKIP_FLEET=1. A gate that is always overridden is not a gate; it
# is a warning nobody reads.
#
# So the inventory says what is true: one desk, one board. That makes the
# refusal meaningful again -- it now means "this release was not run on the
# hardware that exists", which is a sentence worth stopping for.
#
# ADD A DESK when there is one. The gate requires a clean pass from EVERY host
# named here, so a line added to this file is a promise that the machine will
# answer at release time.
#
# There is deliberately NO port in this file. The daemon finds the board by
# USB VID:PID (claude_usage_bridge.py, CH340 0x1A86:0x7523), which survives
# the cable being moved to another socket; a port written down here would not.
#
# `python` must be an interpreter WITH PYSERIAL: the agent spawns
# overwatch_main.py, which imports serial at module scope. Worth checking
# before blaming the hardware:
#
#     <python> -c "import serial; print(serial.__version__)"

[hosts.desk-mac]
ssh = ""                    # empty = run here, with no ssh at all
os = "darwin"

# Board c88541e27668, the one on this desk. Never provisioned, so it holds
# the default edition -- CFG_EDITION_CLAUDE = 0 in firmware/src/cfg_store.h.
# Stated rather than assumed because the edition LATCHES on first write, and
# tools/burn.sh refuses a mismatch: upstream's file said claude against a
# board stamped codex, and every scenario failed for the wrong reason.
board = "claude"

# The repository's own venv, which has pyserial 3.5 from pc/requirements.txt.
# Upstream named .venv-test, which does not exist here.
python = ".venv/bin/python"

workdir = "~/overwatch-fleet"
has_claude_desktop = true
